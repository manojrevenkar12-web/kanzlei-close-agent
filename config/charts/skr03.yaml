# DATEV SKR03, the excerpt the agent proposes into. A firm's own accounts are added at onboarding
# (the group engineer maps each unknown account from the firm's history to a family).
# Check the numbers against the Kontenrahmen version the firm runs before going live.
#
#   auto: true   Automatikkonto: DATEV derives the tax from the account; the export leaves BU empty
#   tax: "*"     the account takes any tax code (the BU key carries it)
#   role         a second account within a family (non-deductible meals, assets by value)

chart: SKR03
account_length: 4
debtors: [10000, 69999]
creditors: [70000, 99999]
system:
  bank: 1200
  cash: 1000
  transit: 1360
  receivables: 1400
  payables: 1600
  suspense: 1590
bu_keys: {U7: "2", U19: "3", V7: "8", V19: "9"}

