name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint, types, tests on Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      KANZLEI_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q

  web:
    name: web (lint, types, unit and flow tests, build)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e:
    name: evaluation, release gate and end-to-end (Playwright) on the seeded demo
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: kanzlei }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      KANZLEI_DEMO_MODE: "true"
      KANZLEI_CORS_ORIGIN: http://localhost:4173
      KANZLEI_TOKEN_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e "backend[sim]"
      - name: Evaluate (development months, blind sets) and apply the release gate
        working-directory: backend
        run: |
          set -o pipefail
          python -m kanzlei_sim evaluate --sets dev,v1,v2 2>&1 | tee ../evaluate.log
          python -m kanzlei_sim gate 2>&1 | tee -a ../evaluate.log
      - name: First runs of blind sets are never rewritten
        run: git diff --exit-code -- reports/blind/*/FIRST_RUN.json
      - name: Seed the demo (July and August signed off, September in progress)
        working-directory: backend
        run: python -m kanzlei_sim seed --reset --links .demo-links.json 2>&1 | tee ../seed.log
      - name: Start the API and the web app
        run: |
          (cd backend && nohup uvicorn kanzlei.api.app:create_app --factory --port 8000 > ../api.log 2>&1 &)
          cd web && npm ci && npx vite build
          (API_URL=http://localhost:8000 nohup npx vite preview --port 4173 --strictPort > ../web.log 2>&1 &)
          npx --yes wait-on@8 -t 60000 http-get://localhost:4173/api/health http-get://localhost:4173/
      - name: Playwright (desktop and phone)
        working-directory: web
        env: { E2E_LINKS: ../backend/.demo-links.json }
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium
          npx playwright test 2>&1 | tee ../playwright.log
      - name: Report failures as annotations
        if: failure()
        run: |
          for f in evaluate.log seed.log playwright.log api.log; do
            [ -f "$f" ] || continue
            body=$(sed 's/\x1b\[[0-9;]*m//g' "$f" | grep -vE '^\s*$' | grep -E -A4 'Error|error|GATE|gate|✘|failed|Traceback' | head -120 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -n "$body" ] && echo "::error title=$f::$body"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-and-evaluation
          path: |
            reports/
            web/playwright-report/
            *.log

  infra:
    name: Terraform (AWS eu-central-1)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: deploy/terraform } }
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8, terraform_wrapper: false }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - name: terraform validate
        run: |
          terraform validate -no-color > validate.log 2>&1 || {
            body=$(sed 's/%/%25/g' validate.log | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error title=terraform validate::$body"; exit 1; }

  images:
    name: container images and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: backend/Dockerfile, target: api, tags: "kanzlei-api:ci", load: true, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: backend/Dockerfile, target: tools, tags: "kanzlei-tools:ci", load: true, cache-from: type=gha }
      - uses: docker/build-push-action@v6
        with: { context: ., file: web/Dockerfile, tags: "kanzlei-web:ci", load: true, cache-from: type=gha }
      - name: Smoke test the images
        run: |
          set -ex
          exec > >(tee smoke.log) 2>&1
          docker network create kca
          docker volume create docs
          docker run -d --name postgres --network kca -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=kanzlei postgres:16-alpine
          until docker exec postgres pg_isready -U postgres -d kanzlei; do sleep 1; done
          env="-e KANZLEI_DATABASE_URL=postgresql://kanzlei_app:kanzlei_app@postgres:5432/kanzlei -e KANZLEI_ADMIN_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/kanzlei -e KANZLEI_TOKEN_SECRET=ci-smoke-secret-with-at-least-32-chars -e KANZLEI_DEMO_MODE=true -e KANZLEI_STORAGE_URL=file:///var/kanzlei/documents"
          docker run --rm --network kca $env kanzlei-api:ci kanzlei migrate
          docker run --rm --network kca $env -v docs:/var/kanzlei/documents kanzlei-tools:ci seed --reset
          docker run -d --name api --network kca $env -v docs:/var/kanzlei/documents kanzlei-api:ci
          docker run -d --name web --network kca -p 8080:8080 -e API_UPSTREAM=http://api:8000 kanzlei-web:ci
          npx --yes wait-on@8 -t 60000 http-get://localhost:8080/api/health
          token=$(curl -fsS -X POST localhost:8080/api/session -H 'content-type: application/json' -d '{"login":"c.hartmann"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS "localhost:8080/api/closes?period=2026-09" -H "authorization: Bearer $token" | python3 -c 'import json,sys; rows=json.load(sys.stdin); assert len(rows)==3 and all(r["items"]>0 for r in rows), rows'
          # Security headers on the page and on static files; metrics never public.
          curl -fsSI localhost:8080/ | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/metrics)" = 404
          docker run --rm --network kca $env kanzlei-api:ci kanzlei verify-audit
      - name: Report failures as annotations
        if: failure()
        run: |
          for c in api web postgres; do docker logs "$c" > "$c.log" 2>&1 || true; done
          for f in smoke.log api.log web.log; do
            [ -s "$f" ] || continue
            body=$(tail -60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$body"
          done
