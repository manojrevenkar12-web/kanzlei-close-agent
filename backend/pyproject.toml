[project]
name = "kanzlei-close-agent"
version = "0.1.0"
description = "The monthly close for a German tax firm's clients: bank and e-invoices in, reviewed bookings, VAT return and DATEV export out."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "psycopg[binary,pool]>=3.2",
  "numpy>=1.26",
  "pydantic-settings>=2.4",
  "pypdf>=5.0",
  "defusedxml>=0.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
sim = ["reportlab>=4.2", "scikit-learn>=1.5"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "reportlab>=4.2", "scikit-learn>=1.5"]

[project.scripts]
kanzlei = "kanzlei.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kanzlei = ["migrations/*.sql"]
kanzlei_sim = ["blind/*.md", "blind/*/*.yaml", "blind/*/*.md"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/kanzlei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs PostgreSQL (KANZLEI_TEST_ADMIN_URL)"]
